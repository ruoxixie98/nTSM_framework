[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ntsm"
version = "0.1.0.dev0"
description = "neuroanatomical topology-informed synergy mapping"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["fMRI", "neuroimaging"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "nibabel>=5.2",
  "numba>=0.60",
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  "threadpoolctl>=3.2",
  "tqdm>=4.66",
]

[project.scripts]
ntsm = "ntsm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ntsm"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
